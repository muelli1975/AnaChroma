[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anachroma"
version = "0.1.0.dev2"
description = "High-quality local anaglyph conversion from full SBS images"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
authors = [{name = "Christoph Müller"}]
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<13", "customtkinter==5.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.gui-scripts]
anachroma = "anachroma.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
