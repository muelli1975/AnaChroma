name: Publish verified AnaChroma 1.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-verified-v1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_RUN: '37922582581'
      VERIFIED_COMMIT: 'fa1f82bd2aa3841e45331b1d1db71aa2dd1519d6'
      RELEASE_TAG: v1.0
    steps:
      - name: Check verified source run and absence of an existing version tag
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" > verified-run.json
          python3 - <<'PY'
          import json, os
          with open("verified-run.json", encoding="utf-8") as stream:
              run = json.load(stream)
          assert run["head_sha"] == os.environ["VERIFIED_COMMIT"], "Source commit differs"
          assert run["repository"]["full_name"] == os.environ["GH_REPO"], "Repository differs"
          assert run["head_branch"] == "main", "Source is not main"
          assert run["event"] == "push", "Source is not a push build"
          assert run["status"] == "completed" and run["conclusion"] == "success", "Build did not pass"
          PY
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > existing-tags.json
          python3 - <<'PY'
          import json, os
          with open("existing-tags.json", encoding="utf-8") as stream:
              refs = json.load(stream)
          assert not any(item["ref"] == "refs/tags/" + os.environ["RELEASE_TAG"] for item in refs), "Existing tag must not be replaced"
          PY
      - name: Read release notes from the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VERIFIED_COMMIT }}
          persist-credentials: false
      - name: Download the verified platform packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name 'AnaChroma-windows-2022' --dir artifacts
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name 'AnaChroma-ubuntu-24.04' --dir artifacts
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name 'AnaChroma-macos-14' --dir artifacts
      - name: Prepare checksums and create a draft from the tested commit
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          packages=('AnaChroma-windows-2022.zip' 'AnaChroma-ubuntu-24.04.tar.gz' 'AnaChroma-macos-14.tar.gz')
          for package in "${packages[@]}"; do
            test -s "$package"
          done
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          cd ..
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Using the existing draft; source and assets are checked in the next step."
          else
            gh release create "$RELEASE_TAG" 'artifacts/AnaChroma-windows-2022.zip' 'artifacts/AnaChroma-ubuntu-24.04.tar.gz' 'artifacts/AnaChroma-macos-14.tar.gz' artifacts/SHA256SUMS.txt --draft --target "$VERIFIED_COMMIT" --title 'AnaChroma 1.0' --notes-file 'RELEASE_NOTES_1.0.md'
          fi
      - name: Verify release source and every uploaded asset before publishing
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" > release-verification.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          with open("release-verification.json", encoding="utf-8") as stream:
              releases = json.load(stream)
          matches = [item for item in releases if item["tag_name"] == os.environ["RELEASE_TAG"]]
          assert len(matches) == 1, "Expected one matching draft release"
          release = matches[0]
          assert release["target_commitish"] == os.environ["VERIFIED_COMMIT"], "Release source differs"
          expected = ["AnaChroma-windows-2022.zip","AnaChroma-ubuntu-24.04.tar.gz","AnaChroma-macos-14.tar.gz","SHA256SUMS.txt"]
          assert release["draft"], "Release must stay draft until verification"
          assets = {asset["name"]: asset for asset in release["assets"]}
          assert set(assets) == set(expected), "Release asset set differs"
          for name in expected:
              path = pathlib.Path("artifacts") / name
              asset = assets[name]
              assert asset["size"] == path.stat().st_size, "Asset size differs: " + name
              digest = asset.get("digest")
              if digest:
                  assert digest == "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(), "Asset digest differs: " + name
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$VERIFIED_COMMIT"
