name: Test and build AnaChroma

on:
  push:
    branches: [main]
    tags: [v1.0]
    paths-ignore:
      - '.github/workflows/refresh-verified-packages.yml'
      - '.github/workflows/publish-verified.yml'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/package-layout-audit.yml'
      - '.github/workflows/normalize-package-names.yml'
      - 'scripts/refresh_verified_packages.py'
      - 'scripts/verified-package-update.json'
      - 'scripts/package-layout-audit.py'
      - 'scripts/package-layout-audit.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux_x64
          - os: windows-2022
            label: Windows_x64
          - os: macos-14
            label: macOS_AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt -e .
      - name: Install Linux reference and display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb libimage-exiftool-perl
      - name: Build native CIELab with matching source distribution
        run: python scripts/build_cielab.py
      - name: Prepare complete official ExifTool distribution
        run: python scripts/prepare_exiftool.py
      - name: Compare with AnaglyphBatch 1.0 CIELab executable
        if: runner.os == 'Windows'
        run: python scripts/compare_cielab.py
      - name: Test with virtual display and reference tools
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/run_tests.py
      - name: Test on Windows or macOS
        if: runner.os != 'Linux'
        run: python scripts/run_tests.py
      - name: Check family UI colors, settings and scaling
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 2560x1920x24" python scripts/check_family_ui.py
      - name: Build portable directory
        run: python scripts/build.py
      - name: Test packaged CIELab executable
        run: python scripts/smoke_cielab.py dist/AnaChroma/tools/cielab
      - name: Archive standalone CIELab tool with corresponding sources
        run: python scripts/archive_cielab.py ${{ matrix.os }}
      - name: Start built GUI under virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_build.py
      - name: Start built GUI on Windows or macOS
        if: runner.os != 'Linux'
        run: python scripts/smoke_build.py
      - name: Add macOS application bundle to portable directory
        if: runner.os == 'macOS'
        run: ditto dist/AnaChroma.app dist/AnaChroma/AnaChroma.app
      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/AnaChroma -DestinationPath dist/AnaChroma_1.0_${{ matrix.label }}.zip
      - name: Archive package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf dist/AnaChroma_1.0_${{ matrix.label }}.tar.gz -C dist AnaChroma
      - name: Upload development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AnaChroma_1.0_${{ matrix.label }}
          path: |
            dist/AnaChroma_1.0_*.zip
            dist/AnaChroma_1.0_*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload CIELab comparison report
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CIELab-reference-comparison
          path: |
            build/cielab-comparison/*.json
            build/cielab-comparison/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload standalone CIELab tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CIELab-${{ matrix.os }}
          path: |
            dist/CIELab-*.zip
            dist/CIELab-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/tags/v1.0'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AnaChroma_1.0_*
          path: artifacts
          merge-multiple: true
      - name: Publish AnaChroma 1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cd ..
          gh release create v1.0 artifacts/* --verify-tag --title 'AnaChroma 1.0' --notes-file RELEASE_NOTES_1.0.md
